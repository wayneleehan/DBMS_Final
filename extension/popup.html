<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <title>AntiFraud 狀態</title>
  <style>
    :root {
      --bg: #fafafa;
      --card: #ffffff;
      --text: #212121;
      --muted: #757575;
      --border: #e0e0e0;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      width: 280px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    .card {
      background: var(--card);
      padding: 16px;
    }
    .header {
      font-size: 12px;
      color: var(--muted);
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }
    .status-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }
    .dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .status-label {
      font-size: 20px;
      font-weight: 600;
    }
    .url {
      font-size: 13px;
      color: var(--muted);
      word-break: break-all;
      margin-bottom: 12px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }
    .row {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      margin-top: 6px;
    }
    .row .key { color: var(--muted); }
    .row .val { font-weight: 500; }
    .score {
      font-size: 28px;
      font-weight: 700;
    }
    .empty {
      padding: 24px 16px;
      text-align: center;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
    }
    /* Status colors */
    .blocked  { color: #D32F2F; }
    .blocked  .dot { background: #D32F2F; }
    .warning  { color: #F57C00; }
    .warning  .dot { background: #F57C00; }
    .low-risk { color: #FBC02D; }
    .low-risk .dot { background: #FBC02D; }
    .safe     { color: #2E7D32; }
    .safe     .dot { background: #2E7D32; }
    .unknown  { color: var(--muted); }
    .unknown  .dot { background: var(--muted); }
  </style>
</head>
<body>
  <div id="root"></div>
  <script src="popup.js"></script>
</body>
</html>
